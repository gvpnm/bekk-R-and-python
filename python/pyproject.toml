[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bekkpub"
version = "0.1.0"
description = "BEKK multivariate GARCH estimation, diagnostics, and publication tables"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["bekkpub*"]

[tool.setuptools.package-data]
bekkpub = ["data/*.csv"]
